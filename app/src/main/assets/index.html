<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  body{color:#14180c;font:12px system-ui;
       background:linear-gradient(180deg,#ffffff,#f6fbe8 55%,#eef9d8);
       display:flex;flex-direction:column;height:100dvh;overflow:hidden}
  #wrap{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px}
  canvas{max-height:100%;max-width:100%;aspect-ratio:9/16;border-radius:16px;background:#000;
         touch-action:none;display:block;box-shadow:0 6px 26px #00000026,0 0 0 1px #00000010}
  #bar{flex:0 0 auto;max-height:44dvh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:8px 8px 24px}
  .sec{background:#ffffff;border:1px solid #e2ecc8;border-radius:14px;padding:8px;display:flex;
       flex-direction:column;gap:7px;flex:0 0 auto;box-shadow:0 1px 2px #00000008}
  .sec h4{font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:#5d7a12;font-weight:800}
  .row{display:flex;gap:6px;overflow-x:auto;flex:0 0 auto;align-items:center;padding-bottom:1px}
  button{background:#f8fbe9;color:#2b3319;border:1px solid #dde8c2;border-radius:11px;min-height:37px;
         padding:0 13px;font-size:11.5px;white-space:nowrap;flex:0 0 auto;font-weight:600}
  button:active{background:#eef7d6}
  button.on{background:#d8f96a;border-color:#93cf12;color:#1a2200}
  button.lock{background:#c8f3d8;border-color:#3ec97a;color:#0a3d20}
  button.prim{background:linear-gradient(180deg,#c8f542,#98dd10);border-color:#8bcb06;color:#16200a}
  button.nudge{min-width:42px;font-size:14px;padding:0 9px}
  label{display:flex;align-items:center;gap:9px;font-size:10.5px;color:#5a6449}
  label span{width:78px;flex:0 0 auto}
  input[type=range]{flex:1;accent-color:#7cc40a;height:26px}
  input[type=file]{display:none}
  input[type=text]{flex:1;background:#f8fbe9;border:1px solid #dde8c2;border-radius:9px;
    color:#1a2200;padding:9px 11px;font-size:12px;min-height:36px}
  .pal{width:26px;height:26px;border-radius:8px;border:1px solid #cfdcb4;flex:0 0 auto}
  .pal.on{outline:2px solid #1a2200}
  .mline{display:flex;align-items:center;gap:8px}
  .mline b{font-size:10px;color:#5a6449;width:64px;flex:0 0 auto;font-weight:600}
  .chip{min-height:32px;font-size:10.5px;padding:0 10px;border-radius:9px}
</style>
